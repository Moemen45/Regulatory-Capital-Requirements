[project]
name = "lumen-capital"
version = "0.1.0"
description = "Regulatory capital platform for a fictional EU bank (Basel/CRR3 credit risk)"
readme = "README.md"
authors = [
    { name = "Moemen Smiri", email = "smiri4545@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
]

[project.scripts]
lumen-capital = "lumen_capital:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"


#appended (check what they do)

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["legacy"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^legacy/"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
